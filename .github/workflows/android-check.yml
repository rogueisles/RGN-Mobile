name: Rogue Wallet Android checks
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Core and signing recovery tests
        run: node --test tests/core.test.cjs tests/signing.test.cjs
      - name: Build development APK and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Rogue-Wallet-development-only
          path: app/build/outputs/apk/debug/app-debug.apk
